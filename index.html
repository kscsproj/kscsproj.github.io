<!doctype html>
<html lang="ja">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>GISデータビューア集</title>
    <link rel="stylesheet" href="/src/style.css" />
  </head>
  <body>
    <header class="topbar">
      <span class="site-name">GISデータビューア集</span>
      <button id="about-toggle" type="button" class="link-button">About this site</button>
    </header>

    <main>
      <div id="gallery" class="gallery"></div>
    </main>

    <div id="about-dialog" class="dialog-overlay" hidden>
      <div class="dialog" role="dialog" aria-labelledby="about-title">
        <h2 id="about-title">About this site</h2>
        <p>
          国土数値情報など国が公開しているオープンデータをもとに、地図で見られる形に
          加工して公開している個人プロジェクトの一覧です。各カードから個別のビューアに
          移動できます。
        </p>
        <button id="about-close" type="button">閉じる</button>
      </div>
    </div>

    <script type="module" src="/src/main.js"></script>
  </body>
</html>
